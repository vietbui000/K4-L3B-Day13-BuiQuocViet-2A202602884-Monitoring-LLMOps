service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  baseline_sample_requests: 10
  baseline_sample_max_latency_ms: 2173
  error_budget_example_requests: 10000
  error_budget_example_allowed: 50
  note: CP0 baseline có 10/10 response dưới 3000 ms (cao nhất 2173 ms trong log server); mẫu nhỏ nên giữ mục tiêu 99.5% cho cửa sổ 28 ngày. Với 10,000 request, ngân sách 0.5% tương đương tối đa 50 request lỗi hoặc chậm.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
